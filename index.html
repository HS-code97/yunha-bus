<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>윤하 버스 - 광양시 실시간 버스</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #f1f5f9; color: #0f172a; min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: #2563eb; color: #fff;
          display: flex; align-items: center; justify-content: center; font-size: 26px; }
  h1 { font-size: 22px; font-weight: 800; }
  .sub { font-size: 13px; color: #64748b; }

  .tabs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .tab {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 2px solid #e2e8f0; border-radius: 14px;
    padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all .15s; text-align: left; min-height: 52px;
  }
  .tab.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  .tab .id { font-size: 11px; font-weight: 400; color: #94a3b8; }

  .refresh-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .btn-refresh {
    flex: 1; background: #2563eb; color: #fff; border: none; border-radius: 12px;
    padding: 13px; font-size: 16px; font-weight: 800; cursor: pointer; min-height: 50px;
  }
  .btn-refresh:disabled { opacity: .6; }
  .updated { font-size: 11px; color: #94a3b8; white-space: nowrap; }

  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.recommended { border: 2px solid #16a34a; background: #f0fdf4; }
  .route-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .badge {
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: #16a34a; color: #fff;
  }
  .badge.normal { background: #94a3b8; }
  .routeno { font-size: 22px; font-weight: 900; }
  .eta { font-size: 30px; font-weight: 900; color: #1d4ed8; line-height: 1.2; }
  .meta { font-size: 13px; color: #475569; margin-top: 4px; }
  .next { font-size: 12px; color: #64748b; margin-top: 6px; border-top: 1px dashed #e2e8f0; padding-top: 6px; }

  .empty { text-align: center; padding: 40px 16px; color: #64748b; background: #fff; border-radius: 16px; }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }

  details.debug { margin-top: 18px; background: #fff; border-radius: 12px; overflow: hidden; }
  details.debug summary {
    padding: 12px 16px; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer;
    list-style: none; user-select: none;
  }
  details.debug summary::before { content: '▸ '; }
  details.debug[open] summary::before { content: '▾ '; }
  details.debug pre {
    background: #0f172a; color: #a5f3fc; padding: 12px; font-size: 11px;
    max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚌</div>
    <div>
      <h1>윤하 버스</h1>
      <div class="sub">광양시 실시간 도착 정보 · 30초 자동 갱신</div>
    </div>
  </header>

  <div class="row" style="display:flex;gap:8px;margin-bottom:14px;">
    <input id="apiKey" type="text" placeholder="Service Key (인코딩 키)"
      style="flex:1;min-width:0;padding:10px;border:2px solid #e2e8f0;border-radius:12px;font-size:12px;" />
    <button id="btnSaveKey" style="padding:10px 14px;border:none;border-radius:12px;background:#64748b;color:#fff;font-weight:700;cursor:pointer;">저장</button>
  </div>

  <div class="row" style="display:flex;gap:8px;margin-bottom:10px;">
    <select id="citySelect" style="flex:1;padding:10px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-weight:700;background:#fff;">
      <option value="36060" selected>광양시 (36060)</option>
      <option value="36030">순천시 (36030)</option>
      <option value="36020">여수시 (36020)</option>
    </select>
    <button id="btnSearchStn" style="padding:10px 14px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;">정류소 검색</button>
  </div>
  <div id="stationResults" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>

  <div class="tabs" id="tabs"></div>

  <div class="refresh-row">
    <button class="btn-refresh" id="btnRefresh">🔄 새로고침</button>
    <span class="updated" id="updatedAt">-</span>
  </div>

  <div class="cards" id="cards"></div>

  <details class="debug">
    <summary>디버그 — 원본 JSON 응답 보기</summary>
    <pre id="rawJson">아직 조회 전입니다.</pre>
  </details>
</div>

<script>
  const ENDPOINT = '/api/bis/1613000/ArvlInfoInqireService/getSttnAcctoArvlPrearngeInfoList';
  const STTN_ENDPOINT = '/api/bis/1613000/BusSttnInfoInqireService/getSttnNoList';
  let CITY_CODE = '36060'; // 광양시 (기본, 상단 선택으로 변경 가능)
  // 디코딩된 원본 키 (기본값). 사용자가 상단 입력창에서 수정 가능
  const ENV_KEY = '5d2+BwGOMy3j2PaOCNtoIxlki1SSVAnm9f8YygGiGXKt2LgVr+Jgvl9LwIvUBsQk3jUV0K5YN4I6DOX/MGG/rQ==';
  let SERVICE_KEY = localStorage.getItem('tago_api_key') || ENV_KEY;

  // ⚠️ 실제 TAGO nodeid는 nodeno(3280671) 앞에 "KYB3280" + 나머지가 붙는 11자리 형식
  const STATIONS = [
    { id: 'KYB328010671', name: '사랑병원 (와우 방면)' },
    { id: 'KYB328010715', name: '사랑병원 건너편 (중마고 방면)' },
    { id: 'KYB328010744', name: '와우중흥APT 건너 (집 앞)' },
  ];
  const RECOMMEND_ROUTES = ['88']; // 집 방면 추천 노선

  let current = STATIONS[0];
  let timer = null;

  const tabsEl = document.getElementById('tabs');
  const cardsEl = document.getElementById('cards');
  const rawEl = document.getElementById('rawJson');
  const updatedEl = document.getElementById('updatedAt');
  const btnRefresh = document.getElementById('btnRefresh');
  const apiKeyEl = document.getElementById('apiKey');
  apiKeyEl.value = SERVICE_KEY;
  document.getElementById('btnSaveKey').onclick = () => {
    const v = apiKeyEl.value.trim();
    if (!v) return;
    SERVICE_KEY = v;
    localStorage.setItem('tago_api_key', v);
    fetchBus();
  };

  function renderTabs() {
    tabsEl.innerHTML = '';
    STATIONS.forEach(st => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (st.id === current.id ? ' active' : '');
      btn.innerHTML = `<span>${st.name}</span><span class="id">${st.id}</span>`;
      btn.onclick = () => { current = st; renderTabs(); fetchBus(); };
      tabsEl.appendChild(btn);
    });
  }

  function fmtEta(sec) {
    if (sec == null || isNaN(sec)) return '-';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? `${m}분 ${s}초` : `${s}초`;
  }

  function renderCards(items) {
    cardsEl.innerHTML = '';
    if (!items || items.length === 0) {
      cardsEl.innerHTML = `
        <div class="empty">
          <div class="icon">🕒</div>
          현재 운행 대기 중입니다.<br/>
          <small>잠시 후 새로고침해 주세요.</small>
        </div>`;
      return;
    }
    // 노선별 그룹핑 (첫 번째 대표 + 다음 도착)
    const byRoute = new Map();
    items.forEach(it => {
      const key = it.routeid ?? it.routeno;
      if (!byRoute.has(key)) byRoute.set(key, []);
      byRoute.get(key).push(it);
    });

    byRoute.forEach(list => {
      const it = list[0];
      const no = String(it.routeno ?? '-').trim();
      const recommended = RECOMMEND_ROUTES.includes(no.replace(/[^0-9]/g, ''));
      const card = document.createElement('div');
      card.className = 'card' + (recommended ? ' recommended' : '');
      const nextHtml = list[1]
        ? `<div class="next">다음 버스: ${fmtEta(Number(list[1].arrtime))} 후 · ${list[1].arrprevstationcnt ?? '-'} 정류장 전</div>`
        : '';
      card.innerHTML = `
        <div class="route-line">
          <span class="routeno">${no}번</span>
          <span class="badge ${recommended ? '' : 'normal'}">${recommended ? '⭐ 추천 · 집 방향' : '일반'}</span>
        </div>
        <div class="eta">${fmtEta(Number(it.arrtime))} 후 도착</div>
        <div class="meta">📍 ${it.arrprevstationcnt ?? '-'}개 정류장 전 · ${it.nodenm ?? ''}</div>
        ${nextHtml}`;
      cardsEl.appendChild(card);
    });
  }

  async function fetchBus() {
    btnRefresh.disabled = true;
    btnRefresh.textContent = '조회 중...';
    try {
      const encodedKey = encodeURIComponent(SERVICE_KEY.trim());
      const url = `${ENDPOINT}?serviceKey=${encodedKey}&cityCode=${CITY_CODE}&nodeId=${current.id}&numOfRows=30&pageNo=1&_type=json`;
      const res = await fetch(url);
      const text = await res.text();
      rawEl.textContent = `[HTTP ${res.status}] ${text}`;

      let data = null;
      try { data = JSON.parse(text); } catch {}
      const header = data?.response?.header;
      if (header && header.resultCode !== '00') {
        // 세션 한도 초과 등 일시적 오류 → 잠시 후 자동 재조회
        cardsEl.innerHTML = `<div class="empty"><div class="icon">⏳</div>일시적으로 조회가 지연되고 있습니다.<br/><small>${header.resultMsg ?? ''} — 곧 자동으로 다시 시도합니다.</small></div>`;
        return;
      }
      const itemsRaw = data?.response?.body?.items?.item;
      const items = Array.isArray(itemsRaw) ? itemsRaw : itemsRaw ? [itemsRaw] : [];
      console.log('[윤하버스 TAGO 응답]', data);
      renderCards(items);
      updatedEl.textContent = `갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
    } catch (e) {
      rawEl.textContent = String(e);
      cardsEl.innerHTML = `<div class="empty"><div class="icon">⚠️</div>정보를 불러오지 못했습니다.<br/><small>${String(e)}</small></div>`;
    } finally {
      btnRefresh.disabled = false;
      btnRefresh.textContent = '🔄 새로고침';
    }
  }

  function startAuto() {
    if (timer) clearInterval(timer);
    timer = setInterval(fetchBus, 30000);
  }

  document.getElementById('citySelect').onchange = (e) => {
    CITY_CODE = e.target.value;
    fetchBus();
  };

  document.getElementById('btnSearchStn').onclick = async () => {
    const resEl = document.getElementById('stationResults');
    resEl.innerHTML = '<span style="font-size:12px;color:#64748b;">검색 중...</span>';
    try {
      const url = `${STTN_ENDPOINT}?serviceKey=${encodeURIComponent(SERVICE_KEY.trim())}&cityCode=${CITY_CODE}&nodeNm=${encodeURIComponent('사랑병원')}&_type=json`;
      const res = await fetch(url);
      const text = await res.text();
      rawEl.textContent = `[정류소검색 HTTP ${res.status}] ${text}`;
      let data = null;
      try { data = JSON.parse(text); } catch {}
      const itemsRaw = data?.response?.body?.items?.item;
      const arr = Array.isArray(itemsRaw) ? itemsRaw : itemsRaw ? [itemsRaw] : [];
      if (arr.length === 0) {
        resEl.innerHTML = '<span style="font-size:12px;color:#dc2626;">검색 결과 없음</span>';
        return;
      }
      resEl.innerHTML = '';
      arr.forEach(it => {
        const btn = document.createElement('button');
        btn.textContent = `${it.nodenm ?? '-'} (${it.nodeid ?? '-'})`;
        btn.style.cssText = 'padding:8px 10px;border:2px solid #a78bfa;border-radius:10px;background:#f5f3ff;font-size:12px;font-weight:700;cursor:pointer;';
        btn.onclick = () => { current = { id: it.nodeid, name: it.nodenm }; renderTabs(); fetchBus(); };
        resEl.appendChild(btn);
      });
    } catch (e) {
      resEl.innerHTML = `<span style="font-size:12px;color:#dc2626;">${String(e)}</span>`;
    }
  };

  btnRefresh.onclick = fetchBus;
  renderTabs();
  fetchBus();
  startAuto();
</script>
</body>
</html>
